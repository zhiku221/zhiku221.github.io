<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zhiku · AI 助手</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/atom-one-dark.min.css">
</head>
<body>
  <div class="app">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <svg viewBox="0 0 32 32" width="28" height="28">
            <path fill="#4080FF" d="M16 2C8.27 2 2 8.27 2 16s6.27 14 14 14 14-6.27 14-14S23.73 2 16 2zm7.5 11.5c-.3 2.5-2.3 4.5-4.8 4.8v4.7c0 .6-.4 1-1 1h-3.4c-.6 0-1-.4-1-1v-4.7c-2.5-.3-4.5-2.3-4.8-4.8H13V6.5h6v6.9h4.5z"/>
          </svg>
          <span>AI 助手</span>
        </div>
        <button class="new-chat-btn" id="newChatBtn" title="新建会话">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </button>
      </div>

      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="searchInput" placeholder="搜索会话...">
      </div>

      <div class="chat-list" id="chatList"></div>

      <div class="sidebar-footer">
        <button class="settings-btn" id="settingsBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          <span>设置</span>
        </button>
        <div class="user-info">
          <div class="avatar">Z</div>
          <div class="user-detail">
            <div class="username">zhiku</div>
            <div class="user-status" id="apiStatus">API 未配置</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- 主聊天区 -->
    <main class="main">
      <header class="chat-header">
        <button class="sidebar-toggle" id="sidebarToggle" title="切换侧边栏">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12h18M3 6h18M3 18h18"/>
          </svg>
        </button>
        <div class="chat-title" id="chatTitle">新会话</div>
        <div class="chat-actions">
          <select class="model-select" id="modelSelect">
            <option value="deepseek-chat">DeepSeek V3</option>
            <option value="deepseek-reasoner">DeepSeek R1 (推理)</option>
            <option value="gpt-4o">GPT-4o</option>
            <option value="claude-3.5-sonnet">Claude 3.5 Sonnet</option>
          </select>
          <button class="header-btn" id="clearChatBtn" title="清空当前会话">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
          </button>
        </div>
      </header>

      <div class="messages" id="messages">
        <div class="welcome" id="welcomeScreen">
          <div class="welcome-icon">
            <svg viewBox="0 0 32 32" width="64" height="64">
              <path fill="#4080FF" d="M16 2C8.27 2 2 8.27 2 16s6.27 14 14 14 14-6.27 14-14S23.73 2 16 2zm7.5 11.5c-.3 2.5-2.3 4.5-4.8 4.8v4.7c0 .6-.4 1-1 1h-3.4c-.6 0-1-.4-1-1v-4.7c-2.5-.3-4.5-2.3-4.8-4.8H13V6.5h6v6.9h4.5z"/>
            </svg>
          </div>
          <h1>你好，我是 zhiku AI 助手</h1>
          <p class="welcome-sub">我可以帮你写作、编程、分析问题。有什么我能帮你的吗？</p>
          <div class="welcome-suggestions">
            <button class="suggestion-btn" data-prompt="帮我写一首关于秋天的诗">
              <span class="emoji">🍂</span>
              <span>帮我写一首关于秋天的诗</span>
            </button>
            <button class="suggestion-btn" data-prompt="用 Python 写一个快速排序">
              <span class="emoji">🐍</span>
              <span>用 Python 写一个快速排序</span>
            </button>
            <button class="suggestion-btn" data-prompt="解释一下什么是区块链">
              <span class="emoji">🔗</span>
              <span>解释一下什么是区块链</span>
            </button>
            <button class="suggestion-btn" data-prompt="帮我润色一段中文文案">
              <span class="emoji">✍️</span>
              <span>帮我润色一段中文文案</span>
            </button>
          </div>
        </div>
      </div>

      <footer class="chat-footer">
        <div class="input-area" id="inputArea">
          <div class="toolbar">
            <button class="tool-btn" title="上传附件">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
              </svg>
            </button>
          </div>
          <textarea 
            id="inputBox" 
            placeholder="发送消息给 AI... (Enter 发送, Shift+Enter 换行)"
            rows="1"
          ></textarea>
          <div class="send-actions">
            <button class="stop-btn" id="stopBtn" style="display:none" title="停止生成">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <rect x="6" y="6" width="12" height="12" rx="2"/>
              </svg>
            </button>
            <button class="send-btn" id="sendBtn" title="发送">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="19" x2="12" y2="5"/>
                <polyline points="5 12 12 5 19 12"/>
              </svg>
            </button>
          </div>
        </div>
        <p class="disclaimer">AI 生成内容仅供参考，请核实重要信息。</p>
      </footer>
    </main>
  </div>

  <!-- 设置弹窗 -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <div class="modal-header">
        <h2>API 设置</h2>
        <button class="modal-close" id="settingsClose">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="provider-tabs">
          <button class="tab-btn active" data-provider="deepseek">DeepSeek</button>
          <button class="tab-btn" data-provider="openai">OpenAI</button>
          <button class="tab-btn" data-provider="custom">自定义</button>
        </div>

        <div class="provider-panel" data-provider="deepseek">
          <div class="form-group">
            <label>API Key</label>
            <input type="password" id="dsApiKey" placeholder="sk-..." autocomplete="off">
          </div>
          <div class="form-group">
            <label>API Base URL</label>
            <input type="text" id="dsBaseUrl" value="https://api.deepseek.com/v1">
          </div>
          <p class="hint">在 <a href="https://platform.deepseek.com/api_keys" target="_blank">DeepSeek 开放平台</a> 获取 API Key</p>
        </div>

        <div class="provider-panel hidden" data-provider="openai">
          <div class="form-group">
            <label>API Key</label>
            <input type="password" id="oaApiKey" placeholder="sk-..." autocomplete="off">
          </div>
          <div class="form-group">
            <label>API Base URL</label>
            <input type="text" id="oaBaseUrl" value="https://api.openai.com/v1">
          </div>
        </div>

        <div class="provider-panel hidden" data-provider="custom">
          <div class="form-group">
            <label>API Key</label>
            <input type="password" id="cuApiKey" placeholder="sk-..." autocomplete="off">
          </div>
          <div class="form-group">
            <label>API Base URL</label>
            <input type="text" id="cuBaseUrl" placeholder="https://your-proxy.com/v1">
          </div>
          <p class="hint">支持任何 OpenAI 兼容的 API 端点（如中转代理、本地 Ollama 等）</p>
        </div>

        <div class="form-group">
          <label>当前使用的 API 提供商</label>
          <select id="activeProvider">
            <option value="deepseek">DeepSeek</option>
            <option value="openai">OpenAI</option>
            <option value="custom">自定义</option>
          </select>
        </div>

        <div class="form-group">
          <label>模型参数 Temperature（0-2）</label>
          <input type="range" id="temperature" min="0" max="2" step="0.1" value="1">
          <span class="range-value" id="tempValue">1.0</span>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="resetBtn">重置所有数据</button>
        <button class="btn-primary" id="saveSettingsBtn">保存</button>
      </div>
    </div>
  </div>

  <!-- 编辑弹窗 -->
  <div class="modal-overlay hidden" id="editModal">
    <div class="modal edit-modal">
      <div class="modal-header">
        <h2>编辑消息</h2>
        <button class="modal-close" id="editClose">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <textarea id="editTextarea" rows="8"></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="editCancelBtn">取消</button>
        <button class="btn-primary" id="editSaveBtn">保存并重新生成</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/api.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
